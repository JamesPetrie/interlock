<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#ffffff"/>

  <!-- internet -->
  <ellipse cx="70" cy="205" rx="48" ry="30" fill="#f2f2f2" stroke="#777" stroke-width="1.5"/>
  <text x="70" y="210" text-anchor="middle" font-size="14" fill="#444">internet</text>

  <!-- hetzner -->
  <rect x="165" y="165" width="130" height="80" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="230" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Hetzner</text>
  <text x="230" y="220" text-anchor="middle" font-size="12" fill="#555">public ingress, TLS</text>

  <!-- cluster boundary -->
  <rect x="340" y="70" width="550" height="270" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="356" y="92" font-size="12" font-style="italic" fill="#777">VCF cluster</text>

  <!-- frontend node -->
  <rect x="370" y="125" width="170" height="160" rx="8" fill="#e8f0fe" stroke="#2b5b8f" stroke-width="2"/>
  <text x="455" y="150" text-anchor="middle" font-size="11" fill="#1a3d66">h100-nvl-1-0-cc</text>
  <text x="455" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3d66">Frontend</text>
  <text x="455" y="208" text-anchor="middle" font-size="12" fill="#1a3d66">API server + tokenizer</text>
  <text x="455" y="228" text-anchor="middle" font-size="12" fill="#1a3d66">software interlock</text>
  <text x="455" y="248" text-anchor="middle" font-size="12" fill="#1a3d66">prover log</text>

  <!-- compute node -->
  <rect x="690" y="125" width="170" height="160" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="775" y="150" text-anchor="middle" font-size="11" fill="#1b5e20">h100-sxm-8-0</text>
  <text x="775" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e20">Compute</text>
  <text x="775" y="208" text-anchor="middle" font-size="12" fill="#1b5e20">vLLM engine</text>
  <text x="775" y="228" text-anchor="middle" font-size="12" fill="#1b5e20">8 × H100</text>
  <text x="775" y="248" text-anchor="middle" font-size="12" fill="#1b5e20">model weights</text>

  <!-- fpga (later) -->
  <rect x="578" y="180" width="74" height="50" rx="6" fill="#fef3e2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="615" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c3d00">FPGA</text>
  <text x="615" y="218" text-anchor="middle" font-size="11" fill="#5c3d00">later</text>

  <!-- arrows -->
  <line x1="120" y1="205" x2="163" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="141" y="195" text-anchor="middle" font-size="11" fill="#555">HTTPS</text>

  <line x1="297" y1="205" x2="368" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="332" y="195" text-anchor="middle" font-size="11" fill="#555">SSH tunnel</text>

  <line x1="542" y1="205" x2="576" y2="205" stroke="#333" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="654" y1="205" x2="688" y2="205" stroke="#333" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="615" y="262" text-anchor="middle" font-size="12" fill="#444">interlock packets</text>
  <text x="615" y="278" text-anchor="middle" font-size="11" fill="#777">TCP now, raw ethernet later</text>
</svg>
