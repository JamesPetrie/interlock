<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="820" height="190" fill="#ffffff"/>

  <!-- zones -->
  <path d="M 349 60 H 578 V 170 H 349 A 10 10 0 0 1 339 160 V 70 A 10 10 0 0 1 349 60 Z" fill="#eef3f8" stroke="none"/>
  <text x="349" y="80" font-size="12" font-style="italic" fill="#2b5b8f">ciphertext</text>
  <path d="M 578 60 H 787 A 10 10 0 0 1 797 70 V 160 A 10 10 0 0 1 787 170 H 578 Z" fill="#fef3e2" stroke="none"/>
  <text x="588" y="80" font-size="12" font-style="italic" fill="#8a5a00">plaintext</text>

  <!-- stage boxes -->
  <g font-size="14" text-anchor="middle">
    <rect x="101" y="100" width="70" height="50" rx="7" fill="#ffffff" stroke="#555" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="136" y="130" fill="#333">Log</text>
    <rect x="215" y="122" width="90" height="40" rx="7" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <text x="260" y="147" fill="#333">Release</text>
    <rect x="349" y="100" width="130" height="50" rx="7" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <text x="414" y="130" fill="#333">Dispatcher</text>
    <rect x="523" y="100" width="110" height="50" rx="7" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <text x="578" y="130" fill="#333">Crypto</text>
    <rect x="677" y="100" width="110" height="50" rx="7" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <text x="732" y="130" fill="#333">vLLM</text>
  </g>

  <!-- bidirectional arrows -->
  <g stroke="#333" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)">
    <line x1="55"  y1="125" x2="97"  y2="125"/>
    <line x1="483" y1="125" x2="519" y2="125"/>
    <line x1="637" y1="125" x2="673" y2="125"/>
  </g>
  <!-- send direction (bottom) through Release into the log, receive direction (top) from the log straight back -->
  <g stroke="#333" stroke-width="2" marker-end="url(#arr)">
    <line x1="345" y1="142" x2="309" y2="142"/>
    <line x1="211" y1="142" x2="175" y2="142"/>
    <line x1="175" y1="108" x2="345" y2="108"/>
  </g>
  <text x="20" y="129" font-size="13" fill="#333">wire</text>
</svg>
