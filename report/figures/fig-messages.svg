<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#333"/></marker></defs>
<rect width="1000" height="310" fill="#ffffff"/>
<text x="30" y="60" font-size="13" text-anchor="start" fill="#555">message</text>
<rect x="300" y="40" width="360" height="30" fill="#fbe3bd" stroke="#e08a1e" stroke-width="1.5"/><text x="480.0" y="60" font-size="12" text-anchor="middle" fill="#8a4b00">message</text>
<line x1="480" y1="72" x2="480" y2="126" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/><text x="492" y="103.0" font-size="11" text-anchor="start" fill="#444">encrypt</text>
<text x="30" y="150" font-size="13" text-anchor="start" fill="#555">encrypted message</text>
<rect x="300" y="130" width="360" height="30" fill="#fbe3bd" stroke="#e08a1e" stroke-width="1.5"/><text x="480.0" y="150" font-size="12" text-anchor="middle" fill="#8a4b00">encrypted message</text>
<line x1="480" y1="162" x2="480" y2="216" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/><text x="492" y="193.0" font-size="11" text-anchor="start" fill="#444">split into packets, each with a header</text>
<text x="30" y="240" font-size="13" text-anchor="start" fill="#555">packets</text>
<rect x="300" y="220" width="90" height="30" fill="#d6e6f7" stroke="#2f6cbf" stroke-width="1.5"/><text x="345" y="233" font-size="10.5" text-anchor="middle" fill="#1e4f8f" font-weight="bold">header</text><text x="345" y="245" font-size="10" text-anchor="middle" fill="#1e4f8f">ID X</text>
<rect x="390" y="220" width="220" height="30" fill="#fbe3bd" stroke="#e08a1e" stroke-width="1.5"/><text x="500.0" y="240" font-size="12" text-anchor="middle" fill="#8a4b00">part 1</text>
<rect x="640" y="220" width="90" height="30" fill="#d6e6f7" stroke="#2f6cbf" stroke-width="1.5"/><text x="685" y="233" font-size="10.5" text-anchor="middle" fill="#1e4f8f" font-weight="bold">header</text><text x="685" y="245" font-size="10" text-anchor="middle" fill="#1e4f8f">ID Y · ref X</text>
<rect x="730" y="220" width="140" height="30" fill="#fbe3bd" stroke="#e08a1e" stroke-width="1.5"/><text x="800.0" y="240" font-size="12" text-anchor="middle" fill="#8a4b00">part 2</text>
<text x="500" y="292" font-size="11.5" text-anchor="middle" fill="#1e4f8f">each packet references the previous one: the packets of a message form a linked list</text>
</svg>
