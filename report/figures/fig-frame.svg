<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="220" fill="#ffffff"/>
  <text x="450" y="40" font-size="13" font-style="italic" text-anchor="middle" fill="#555">one Ethernet frame</text>
  <line x1="40" y1="52" x2="860" y2="52" stroke="#999"/><line x1="40" y1="46" x2="40" y2="58" stroke="#999"/><line x1="860" y1="46" x2="860" y2="58" stroke="#999"/>
  <rect x="40" y="70" width="130" height="60" fill="#eeeeee" stroke="#8c8c8c" stroke-width="2"/>
  <text x="105" y="105" font-size="13" text-anchor="middle" fill="#555">Ethernet header</text>
  <rect x="170" y="70" width="220" height="60" fill="#d6e6f7" stroke="#2f6cbf" stroke-width="2"/>
  <text x="280" y="97" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e4f8f">packet header</text>
  <text x="280" y="116" font-size="12" text-anchor="middle" fill="#1e4f8f">cleartext, 64 bytes</text>
  <rect x="390" y="70" width="400" height="60" fill="#fbe3bd" stroke="#e08a1e" stroke-width="2"/>
  <text x="590" y="97" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a4b00">payload</text>
  <text x="590" y="116" font-size="12" text-anchor="middle" fill="#8a4b00">encrypted</text>
  <rect x="790" y="70" width="70" height="60" fill="#eeeeee" stroke="#8c8c8c" stroke-width="2"/>
  <text x="825" y="105" font-size="13" text-anchor="middle" fill="#555">FCS</text>
  <g font-size="13" text-anchor="middle">
    <text x="105" y="165" fill="#555">rebuilt</text>
    <text x="280" y="165" fill="#1e4f8f">read and checked</text>
    <text x="590" y="165" fill="#8a4b00">hashed, never decrypted</text>
    <text x="825" y="165" fill="#555">rebuilt</text>
  </g>
</svg>
