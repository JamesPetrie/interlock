<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#333"/></marker>
    <marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><polygon points="10 0, 0 4, 10 8" fill="#333"/></marker>
  </defs>
  <rect width="1200" height="300" fill="#ffffff"/>
  <!-- verifier boundary around the cluster -->
  <rect x="810" y="60" width="370" height="170" rx="12" fill="none" stroke="#3b82d6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="995" y="49" font-size="15" font-style="italic" text-anchor="middle" fill="#3b82d6">Verifier boundary</text>
  <!-- users -->
  <g fill="#8a4b00" stroke="none">
    <circle cx="60" cy="112" r="11"/><path d="M 40 150 a 20 20 0 0 1 40 0 z"/>
    <circle cx="100" cy="112" r="11"/><path d="M 80 150 a 20 20 0 0 1 40 0 z"/>
    <circle cx="140" cy="112" r="11"/><path d="M 120 150 a 20 20 0 0 1 40 0 z"/>
  </g>
  <text x="100" y="185" font-size="18" font-weight="bold" text-anchor="middle" fill="#8a4b00">Users</text>
  <!-- internet cloud -->
  <path d="M 262 175 a 32 32 0 0 1 8 -62 a 38 38 0 0 1 72 -20 a 34 34 0 0 1 56 26 a 30 30 0 0 1 -4 56 z" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="2"/>
  <text x="330" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#555">Internet</text>
  <!-- prover frontend -->
  <rect x="470" y="105" width="180" height="80" rx="10" fill="#fbe3bd" stroke="#e08a1e" stroke-width="2.5"/>
  <text x="560" y="140" font-size="19" font-weight="bold" text-anchor="middle" fill="#8a4b00">Prover</text>
  <text x="560" y="164" font-size="19" font-weight="bold" text-anchor="middle" fill="#8a4b00">Frontend</text>
  <!-- certifier -->
  <rect x="720" y="105" width="180" height="80" rx="10" fill="#d6e6f7" stroke="#2f6cbf" stroke-width="2.5"/>
  <text x="810" y="140" font-size="19" font-weight="bold" text-anchor="middle" fill="#1e4f8f">Network</text>
  <text x="810" y="164" font-size="19" font-weight="bold" text-anchor="middle" fill="#1e4f8f">Certifier</text>
  <!-- cluster -->
  <rect x="960" y="105" width="190" height="80" rx="10" fill="#fbe3bd" stroke="#e08a1e" stroke-width="2.5"/>
  <text x="1055" y="140" font-size="19" font-weight="bold" text-anchor="middle" fill="#8a4b00">Prover</text>
  <text x="1055" y="164" font-size="19" font-weight="bold" text-anchor="middle" fill="#8a4b00">Compute</text>
  <!-- arrows -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="172" y1="145" x2="248" y2="145" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="402" y1="145" x2="466" y2="145" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="654" y1="145" x2="716" y2="145" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="904" y1="145" x2="956" y2="145" marker-start="url(#b)" marker-end="url(#a)"/>
  </g>
</svg>
