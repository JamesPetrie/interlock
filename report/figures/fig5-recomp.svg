<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#333"/></marker></defs>
  <rect width="1000" height="300" fill="#ffffff"/>
  <rect x="40" y="100" width="180" height="60" rx="8" fill="#e3eefb" stroke="#2f5b9a" stroke-width="1.5"/>
  <text x="130" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f3f6e">Prover frontend</text>
  <rect x="380" y="80" width="220" height="100" rx="8" fill="#fdf3e2" stroke="#b8862b" stroke-width="1.5"/>
  <text x="490" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#5c3d00">Recomputation certifier</text>
  <text x="490" y="145" font-size="11" text-anchor="middle" fill="#5c3d00">check, hash, score, reveal</text>
  <rect x="740" y="60" width="230" height="140" rx="10" fill="none" stroke="#3a8f3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="855" y="80" font-size="11" text-anchor="middle" fill="#3a8f3a">verifier enclosure</text>
  <rect x="765" y="95" width="180" height="80" rx="8" fill="#e6f4e6" stroke="#3a8f3a" stroke-width="1.5"/>
  <text x="855" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f5f1f">Recomputation</text>
  <text x="855" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f5f1f">node</text>
  <g font-size="11" fill="#444" text-anchor="middle">
    <line x1="222" y1="130" x2="375" y2="130" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><text x="298" y="122">challenged pair</text>
    <line x1="602" y1="105" x2="760" y2="105" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><text x="681" y="98">context, key</text>
    <line x1="760" y1="135" x2="604" y2="135" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><text x="681" y="128">estimate</text>
    <line x1="602" y1="165" x2="760" y2="165" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/><text x="681" y="158">reveal one unit</text>
    <text x="681" y="190" fill="#8a5a00">repeat per position</text>
    <line x1="490" y1="182" x2="490" y2="230" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  </g>
  <rect x="380" y="235" width="220" height="36" rx="6" fill="#fdf3e2" stroke="#b8862b" stroke-width="1.5"/>
  <text x="490" y="258" font-size="12" font-weight="bold" text-anchor="middle" fill="#5c3d00">certificate (Û)</text>
