[project]
name = "ilstack"
version = "0.1.0"
description = "Inference-serving stack speaking the interlock verification protocol (v6)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
frontend = ["fastapi", "uvicorn", "tokenizers", "transformers"]
compute = ["vllm"]
dev = ["pytest", "httpx"]

[project.scripts]
ilstack = "ilstack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ilstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
